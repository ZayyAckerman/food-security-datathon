services:
  postgres:
    image: postgres:16-alpine
    container_name: food-security-postgres
    environment:
      POSTGRES_DB: food_datathon
      POSTGRES_USER: food_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5433:5432"
    volumes:
      - food_security_postgres_data:/var/lib/postgresql/data

volumes:
  food_security_postgres_data: